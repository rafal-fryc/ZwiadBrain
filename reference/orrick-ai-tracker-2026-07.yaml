    law_link: "https://www.azleg.gov/legtext/56leg/2R/laws/0193.pdf"
    requirements: "Grants any Arizona citizen (or a candidate for public office or political party office who will appear on the ballot in Arizona) the right to bring an action for preliminary and permanent declaratory relief (and, in certain circumstances, injunctive relief or damages) where: - A digital impersonation (typically video, audio or still image generated by AI) of the person was published to one or more other persons without that person’s consent; - At the time of publication it would not be obvious to a reasonable person that the content was a digital impersonation and the publisher did not reasonably convey to the recipients that the content was a digital impersonation or that its authenticity was disputed; and - The digital impersonation presents some risk of harm (e.g., depicting the person engaging in a criminal or sexual act, resulting in personal hardship or the loss of employment, presenting a risk to an upcoming election)."
