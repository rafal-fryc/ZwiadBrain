  - jurisdiction: "US-CA"
    state: "California"
    orrick_topic: "AI Transparency"
    name: "California AI Transparency Act As Amended by AB 853 (2025)"
    bill_number: null
    citation: "Cal. Bus. & Prof. Code § 22757 et seq."
    effective_date: "2026-08-02"
    effective_raw: null
    bill_key: null
    law_link: "https://infobytes.orrick.com/wp-content/uploads/California-AI-Transparency-Act-and-Amendment2.pdf"
    requirements: "- Requires providers of certain covered generative AI systems to: - Offer users the option to include in AI-generated image, video or audio content an indicator that the content is AI-generated content; - Include a detectable, latent disclosure in AI-generated image, audio, and video content created by the provider’s AI system that the content was generated by the system; and - Develop and make available tools to detect whether specified content was generated by the provider’s system. - Starting January 1, 2027, prohibits a GenAI system hosting platform from knowingly making available a GenAI system that does not place the disclosures identified above. - Starting January 1, 2027, requires certain large online platforms to: - Detect whether any provenance data that is compliant with widely adopted specifications adopted by an established standards-setting body is embedded into or attached to content distributed on the platform; and - Provide a user interface to disclose the availability of system provenance data that reliably indicates that the content was generated or substantially altered by a GenAI system or captured by a capture device. - Starting January 1, 2028, requires \"capture device manufacturers\" (e.g., camera and mobile phone manufacturers) to: - Embed a latent disclosure in content captured by the device by default; and - Offer users the option to include a disclosure containing certain information in content captured by the capture device."
    enforcement: "Up to $5,000 per violation."
