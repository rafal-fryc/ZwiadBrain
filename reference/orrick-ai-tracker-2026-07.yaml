  - jurisdiction: "US-CO"
    state: "Colorado"
    orrick_topic: "User-Facing AI"
    name: "Concerning Requirements for an Operator of a Conversational Artificial Intelligence Service"
    bill_number: "HB 1263"
    citation: null
    effective_date: "2027-01-01"
    effective_raw: null
    bill_key: "co-hb-1263"
    law_link: "https://media.orrick.com/Media%20Library/public/files/ailawcenter/2026/06/co-hb-1263.pdf"
    requirements: "- Requires any person who develops and makes available an artificial intelligence system that primarily simulates human conversation and interaction through adaptive textual, visual, or aural communications (a \"conversational AI service\") to the public (an \"operator\") to: - Use commercially reasonable methods or generally accepted methods to estimate the age of account holders or users; - Clearly and conspicuously disclose that the conversational AI service is artificial intelligence (i) at the beginning of a user's first interaction with the service for each day of interaction, (ii) at least once every 3 hours in a continuous conversational interaction (or as a persistent disclosure), and (iii) be provided in response to user prompts regarding whether the conversational AI service is AI or human; - Implement a protocol for the conversational AI service to respond to user prompts regarding suicidal ideation or self-harm that includes but is not limited to making a referral to a suicide hotline, crisis text line, or other appropriate crisis services; and - Refrain from using any term, letter, or phrase in the advertising, interface, or output of a conversational AI service that represents it is, or is equivalent to, a licensed health-care professional, legal professional, mental health professional or qualified dietitian. - Requires operators to implement additional procedures for minor users, including (i) providing a clear and conspicuous disclosure that they are interacting with AI via a persistent disclaimer or at the beginning of each session and at least every three hours in a continuous conversation, (ii) not providing the user with points or similar rewards at unpredictable intervals with the intent to encourage increased engagement with the service, (iii) instituting technically feasible measures to prevent the conversational AI service from producing textual, visual or aural material of explicit sexual conduct, producing an intimate digital depiction, generating a statement that the minor should engage in explicit sexual conduct, or engaging in erotic or sexually explicit interactions with the minor, (iv) instituting reasonable measures to prevent the service from generating statements that simulate emotional dependence or isolation from real-world supports, (v) implementing a protocol prohibiting the service from engaging in explicit sexual conduct with a minor, and to stop the service from engaging in response to a user prompt regarding explicit sexual conduct with a minor, and (v) offering tools for managing privacy and account settings. - Requires annual reporting to the Attorney General's Office. - Expressly excludes, among other things, software applications, web interfaces, or computer programs that are primarily designed and marketed for use by a developer or researcher, to provide commerce-related or transactional assistance, or for commercial use by business entities for the purpose of business operations, productivity, information analysis, internal research, training, or technical assistance."
    enforcement: "- Constitutes an unfair trade practice enforceable under the Colorado Consumer Protection Act."
  - jurisdiction: "US-CO"
