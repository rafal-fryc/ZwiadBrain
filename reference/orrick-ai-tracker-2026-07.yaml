  - jurisdiction: "US-CA"
    state: "California"
    orrick_topic: "Frontier or General-Purpose AI"
    name: "Transparency in Frontier Artificial Intelligence Act"
    bill_number: "SB 53"
    citation: null
    effective_date: "2026-01-01"
    effective_raw: null
    bill_key: "ca-sb-53"
    law_link: "https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SB53"
    requirements: "Imposes obligations on developers who have trained, or initiated training of, a foundation model that was trained using a quantity of computing power greater than 10^26 integer or floating-point operations (\"Frontier Model\"), including: - Publishing a report on its website with information about the model. - Reporting any critical safety incident involving its models to the OES within 15 days of discovery (and within 24 hours to an appropriate authority in certain circumstances). - Refraining from making materially false or misleading statements regarding the catastrophic risks of its models or how those risks are managed. - Refraining from taking action against an employee for (or issuing policies or contracts that attempt to stop an employee from) reporting serious safety risks or legal violations (plus requiring implementation of certain other whistleblower procedures). Large frontier model developers with over $500 million in annual revenue must also publish and follow an AI safety and oversight framework, submit a summary of catastrophic risk assessments to the OES, provide additional detail in its online report, and implement additional whistleblower procedures."
    enforcement: "Provides a civil penalty up to $1 million per violation by a large frontier developer, enforced by the state attorney general."
  - jurisdiction: "US-CO"
    state: "Colorado"
    orrick_topic: "Automated Decision-Making"
    name: "Colorado AI Act As amended by SB26-189"
    bill_number: null
    citation: "Co. Rev. Stat. § 6-1-1701 et seq."
    effective_date: "2027-01-01"
    effective_raw: null
    bill_key: null
    law_link: "https://leg.colorado.gov/bill_files/116489/download"
    requirements: "​ ​ - Governs \"covered automated decision-making technology\" or \"covered ADMT\", which is defined to mean a technology that processes personal data and uses computation to generate output that is used to make, guide, or assist a decision, judgment or determination concerning an individual ( \"automated decision-making technology\") that is used to materially influence a \"consequential decision\" (or a decision, determination, or action about a consumer that relates to the provision of or access to (or different terms relating to) an education enrollment or an education opportunity, employment or an employment opportunity that creates an employer-employee relationship, the lease or purchase of residential real estate, a financial or lending service, insurance (and its benefits), health-care services, or essential government services and public benefits). - Requires developers of covered ADMT to make available to each deployer information relating to the intended uses and known harmful / inappropriate uses of the covered ADMT, the data used to train the covered ADMT, any known limitations of the covered ADMT, and the appropriate use, monitoring, and meaningful human review of the covered ADMT--as well as notice of material updates. - Requires deployers to disclose to the consumer prior to the use of a covered ADMT to materially influence a consequential decision that such a tool is being used. - Requires deployers that use a covered ADMT to materially influence a consequential decision that results in an adverse outcome for a consumer to provide an adverse outcome notice that describes the consequential decision and the role the covered ADMT played in the consequential decision, provides instructions and a process for obtaining additional information about the covered ADMT and its inputs, and an explanation of the consumers' rights to access and correct personal data use by the covered ADMT and to request the deployer to reconsider the consequential decision using meaningful human review (to the extent commercially reasonable). - Clarifies that a developer or deployer may be held liable in an action alleging unlawful discrimination under state anti-discrimination laws arising from a consequential decision materially influenced by a covered ADMT."
    enforcement: "Up to $20,000 per violation."
