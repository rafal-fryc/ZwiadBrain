    requirements: "- Requires carriers that use artificial intelligence systems for utilization reviews to ensure that their artificial intelligence systems (i) base their determination solely on permissible information, (ii) do not base their determinations solely on group data, (iii) are not used in any way that discriminates against individuals in violation of the law, (iv) are fairly and equitably applied, (v) produce and retain documentation, audit logs, and model-governance records, (vi) are periodically reviewed to maximize accuracy and reliability, (vii) do not use individual's health data beyond its intended or stated purpose, and (viii) their criteria and guidelines comply with applicable state or federal law concerning utilization review and coverage for health-care services. - Establishes that carriers that use artificial intelligence systems for utilization reviews provide written disclosures to the Department of Human Services or the Department of Health Care Policy and Financing that include how, why and when AI is used in their processes. - Prohibits a carrier's denial of coverage based in whole or in part on medical necessity from being issued solely on the output of an AI system without human review and approval of the denial by authorized personnel. - Prohibits the carrier's payment for AI-led psychotherapy services that violate the state's psychotherapy service AI rules."
