    name: "The Responsible AI Safety and Education (RAISE) Act Passed by the Legislature as A 6453A | Reflecting amendments from S 8828"
    bill_number: null
    citation: "New York General Business Law, Article 44-B"
    effective_date: "2027-01-01"
    effective_raw: null
    bill_key: null
    law_link: "https://legislation.nysenate.gov/pdf/bills/2025/S8828"
    requirements: "Requires developers who have trained, or initiated the training of, a frontier model and, individually or together with its affiliates, had annual gross revenues in excess of $500 million in the preceding calendar year (i.e., \"large frontier developers\") to comply with obligations imposed on frontier models that are developed, deployed, or operated in whole or in part in New York, including: - Writing, implementing, complying with and publishing a frontier AI framework detailing how the large frontier developer handles certain risk-related and other expectations. - Publishing a transparency report providing information about the developer and the model. - Filing a disclosure statement with the department of financial services. - Retaining an unredacted copy of any of the documents above when the published version is redacted for permitted reasons. - Transmitting to the department of financial services a summary of any assessment of catastrophic risk resulting from internal use of a frontier model. - Reporting any critical safety incident pertaining to its frontier model to the department of financial services within 72 hours of learning of the incident or of facts sufficient to establish a reasonable belief that a critical safety incident has occurred (within 24 hours to an authority if the incident poses an imminent risk of death or serious physical injury). - Refraining from making a materially false or misleading statements about catastrophic risk from its frontier models, its management of catastrophic risk, or its frontier AI framework. \"Frontier model\" is defined to mean an AI model that (a) is trained on a broad data set, designed for generality of output, and adaptable to a wide range of distinctive tasks (i.e., a \"foundational model\"), and (b) was trained using a quantity of computing power greater than 10^26 integer or floating-point operations."
    enforcement: "Up to $1million for a first violation and $3 million for subsequent violations."
