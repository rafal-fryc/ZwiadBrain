    requirements: "- Expands existing \"personal identity\" protections against abuse to include any simulation, reproduction, or artificial recreation of a person's identity (with some exception). - Establishes that every person has the exclusive right to use their own personal identity. This right includes a replication right, meaning only the individual may consent to the use of their likeness in a simulation, reproduction, or artificial recreation of their personal identity. An individual’s replication right is licensable but not assignable during their lifetime and does not expire until 70 years after their death. - Sets the conditions under which an individual’s “personal identity” is abused, such as when their likeness is used for advertising, fundraising, solicitation of donations, or the purchase of goods or services. Furthermore, an individual’s “personal identity” is abused if another person knowingly distributes their likeness without authorization, or distributes, sells, or licenses tools primarily intended to unlawfully create or alter content containing someone’s personal identity. - Makes it unlawful to distribute, sell, or license any technology whose intended primary purpose is the unauthorized creation or modification of content that includes an individual's personal identity for commercial purposes."
