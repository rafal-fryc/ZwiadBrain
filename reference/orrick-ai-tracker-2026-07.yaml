    citation: null
    effective_date: "2027-01-01"
    effective_raw: null
    bill_key: "or-sb-1546"
    law_link: "https://media.orrick.com/Media%20Library/public/files/ailawcenter/sb1546.pdf"
    requirements: "- Requires operators of artificial intelligence companions or AI companion platforms to provide users with notice that they are interacting with artificially generated output and not a natural person if a reasonable person would believe that the person is interacting with a natural person. - Prohibits operators from providing AI companions or AI companion platforms unless the operator has, and publishes online, a protocol for using evidence-based methods for detecting input from the user that consists of suicidal ideation or intent or self-harm ideation or intent and that prevents the provision of content to the user that encourages suicidal ideation, suicide or self-harm in the user (including at a minimum providing the user with referral to and contact information and hyperlink for the national 9-8-8 suicide and crisis lifeline). - Imposes additional obligations where the operator knows or has reason to believe that a user is a minor, including (i) undertaking reasonable measures to prevent the AI companion from generating statements that would lead a reasonable person to believe that the person is interacting with another natural person, (ii) disclose to the user that the user is interacting with AI-generated output, (iii) provide a reminder at least every three hours that the user should take a break from interactions with the system, and (iv) use reasonable measures to ensure that the AI companion / platform does not produce visual representations of sexually explicit conduct or suggest or state that the minor should engage in sexually explicit conduct. - Requires operators to post annually a report that discloses the number of times during the calendar year the operator provided a referral to a crisis hotline and the details of the operators protocol for addressing the obligations set forth above."
    enforcement: "- Private right of action for injunctive relief, and the greater of an individual's actual damages or statutory damages of $1,000 for each violation."
