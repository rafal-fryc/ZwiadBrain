    requirements: "Regulations clarify the application of existing antidiscrimination laws in the workplace in the context of new and emerging technologies, including AI that makes a decision or facilitates human decision making regarding an employment benefit (\"Automated-Decision System\"): - Employers must not use automated-decision systems that discriminate against applicants or employees on the basis of protected characteristics. - Employers must maintain employment records, including automated-decision system data, for a minimum period of four years."
