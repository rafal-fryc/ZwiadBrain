    requirements: "- Requires operators of a \"companion chatbot platform\" to: - Issue a clear and conspicuous notification indicating that the chatbot is artificially generated and not human where a reasonable person interacting with the bot would be misled to believe that the person is interacting with a human; - Maintain and publish online details about a protocol for preventing the production of suicidal ideation, suicide, or self-harm content to the user (including automated notification to the user that refers them to crisis service providers if they express such ideas); - Implement measures where the operator knows a user is a minor (under 18) to disclose that the user is interacting with AI, provide a clear and conspicuous notification at least every 3 hours that reminds the user to take a break and that the bot is AI, and institute reasonable measures to prevent the bot from producing visual material of sexually explicit conduct or directly stating the minor should engage in sexually explicit conduct; - Disclose on its platform that companion chatbots may not be suitable for some minors; and - Report annually on its compliance."
