    law_link: "https://media.orrick.com/Media%20Library/public/files/ailawcenter/2026/04/mehp1397.pdf"
    requirements: "- Regulates the use of artificial intelligence by licensed psychotherapy or behavioral health therapy professionals. - Allows AI to provide administrative and supplementary support only if the professional assumes full responsibility for all interactions, outputs, and data use associated with the AI. - To use AI for recorded or transcribed sessions, the professional must provide clients or their representatives with written notice detailing the AI’s use, its purposes, and information regarding data collection and processing, for which consent must be obtained. - Prohibits individuals from advertising or offering therapy services through an Internet-based artificial intelligence system unless the services are provided by a licensed professional. The professional must not allow the AI to make independent therapeutic decisions, interact with clients in any form of therapeutic communication, or generate recommendations or treatment plans without review and approval. - Carves out an exception for cases where an AI-based intervention is used solely within an approved research project or is authorized by the U.S. Department of Health and Human Services or the Centers for Medicare and Medicaid Services."
    enforcement: "- Violations may constitute a violation of the Maine Unfair Trade Practices Act and may be subject to disciplinary action by the Board."
