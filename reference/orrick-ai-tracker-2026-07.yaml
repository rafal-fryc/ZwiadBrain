    requirements: "- Regulates various aspects of AI use in public schools. Requirements include that all AI tools be deployed through educator-directed use, AI tools must operate with a human-in-the-loop, tools must be age appropriate with a clearly defined educational purpose, and a restriction against AI tools being used as the primary basis for grading, promotion or discipline. - School districts must adopt several changes to comply with this law. The law r equires school districts to minimize the amount of student data shared with AI systems. The law also requires school districts provide parents/guardians with an annual disclosure of the tools, data, extent, and the educational purpose of AI tools in the classroom. Finally school districts must adopt and maintain an artificial intelligence and emerging technology policy."
