  - jurisdiction: "US-UT"
    state: "Utah"
    orrick_topic: "AI Intimate Images"
    name: "Digital Voyeurism Prevention Act"
    bill_number: "HB 276"
    citation: null
    effective_date: "2027-01-01"
    effective_raw: null
    bill_key: "ut-hb-276"
    law_link: "https://le.utah.gov/Session/2026/bills/enrolled/HB0276.pdf"
    requirements: "- Establishes that the distribution of a counterfeit intimate image by a person that operates, maintains, or provides an interactive computer service that enables users to generate images and distributes those generated images to users through the service (\"generation services\") without the consent of the identifiable individual depicted in the image is a violation of the individual's reasonable expectation of privacy. - Requires generation services to take reasonable measures to inform users that distribution of non-consensual counterfeit intimate images is prohibited, violations of the law may result in civil liability, and the service provides procedures for reporting violations (along with instructions for reporting violations). - Creates a safe harbor where the generation service demonstrates that: - The generation service does not hold itself out as providing services for creating counterfeit intimate images; - The generation service has implemented and maintains a written policy that prohibits generation and distribution of non-consensual counterfeit intimate images, includes reasonable safeguards designed to prevent the creation of counterfeit intimate images, and included procedures for responding to reports of violations; - The generation service has published the policy in a clear and conspicuous location accessible to the public not he generation service's website or primary user interface; - The generation service published a general description of the safeguards implemented; - The generation service implemented and maintained a sufficient consent system; and - The generation service followed its policy in relation to the alleged violation and upon receiving notice that a counterfeit intimate image was created or distributed without consent, took prompt action to prevent further distribution. - Requires websites and other online services that serve the public and primarily provide a forum for user-generated content or publish, curate, host, or make available content of nonconsensual intimate visual depictions (\"covered providers\") to not knowingly allow the distribution of a counterfeit intimate image without consent from the identifiable individual depicted in the counterfeit intimate image and establish and implement notice and removal procedures aligned with the Take It Down Act. A similar safe harbor as outlined above is available to covered providers."
    enforcement: "- Private right of action to seek injunction, actual damages (including damages for emotional distress), punitive damages, and reasonable attorney fees and costs (with each distribution of a counterfeit intimate image without consent constituting a separate violation of the law)."
