  - jurisdiction: "US-CO"
    state: "Colorado"
    orrick_topic: "AI Healthcare"
    name: "Concerning Restrictions on the Use of Artificial Intelligence Relating to Psychotherapy Services"
    bill_number: "HB 1195"
    citation: null
    effective_date: "2026-08-12"
    effective_raw: null
    bill_key: "co-hb-1195"
    law_link: "https://media.orrick.com/Media%20Library/public/files/ailawcenter/2026/06/co-hb-1195.pdf"
    requirements: "- Outlines permitted and prohibited uses of artificial intelligence in the provision of psychotherapy services. - Permits AI use by individuals lawfully permitted to provide psychotherapy services for the purposes of administrative support or supplementary support for pyschotherapy services, provided the licensed individual maintains responsibility for any artificially generated output and satisfies the requirements set forth below. - Prohibits lawful providers of psychotherapy services from using artificial intelligence systems to (i) record or transcribe a client's therapeutic session without consent, or (ii) interact with clients in any form of therapeutic communication without the direct oversight from the provider, or (iii) provide therapeutic recommendations or treatments without a provider's review and approval. - Requires the provider to provide to the client written information concerning these prohibitions. - Prohibits any person from using any term, letter, or phrase in the advertising, interface, or outputs of an artificial system in a manner that indicates or implies that the AI system's output data is being provided by or endorsed by, or is the equivalent of a licensed pyschotherapy professional, or otherwise representing the AI system provides psychotherapy services or a user's data is confidential in a manner similar to therapist-client confidentiality."
    enforcement: "- Constitutes an unlawful practice by a licensed psychotherapy provider, which is subject to existing penalties including revocation of license. - Constitutes an unfair trade practice enforceable under the Colorado Consumer Protection Act."
  - jurisdiction: "US-CO"
    state: "Colorado"
