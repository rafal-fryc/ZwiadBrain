    requirements: "- Extends to AI technology providers pre-existing prohibitions on the use of any terms, letters, or phrases to indicate or imply (i) possession of a license or certificate to practice a healthcare profession without one or (ii) that the services being offered are being provided by a licensed or certified health care professional (where such claim is not true)."
