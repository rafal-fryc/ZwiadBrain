    effective_raw: null
    bill_key: "id-s-1297"
    law_link: "https://media.orrick.com/Media%20Library/public/files/ailawcenter/s1297.pdf"
    requirements: "- Requires any person who develops and makes available an artificial intelligence system that primarily simulates human conversation and interaction through textual, visual, or aural communications (a \"conversational AI service\") to the public (an \"operator\") to: - Clearly and conspicuously disclose that the conversational AI service is artificial intelligence if reasonable persons would be misled to believe that they are interacting with a human; - Adopt a protocol for the conversational AI service to respond to user prompts regarding suicidal ideation that includes but is not limited to making reasonable efforts to provide a response to users that refers them to crisis service providers such as a suicide hotline, crisis text line, or other appropriate crisis services; and - Refrain from knowingly and intentionally causing or programing a conversational AI service to make any representation or statement that explicitly indicates that the conversational AI service is designed to provide professional mental or behavioral health care. - Requires operators to implement additional procedures for minor users, including (i) providing a clear and conspicuous disclosure that they are interacting with AI via a persistent disclaimer or at the beginning of each session and at least every three hours in a continuous conversation, (ii) not providing the user with points or similar rewards at unpredictable intervals with the intent to encourage increased engagement with the service, (iii) instituting reasonable measures to prevent the conversational AI service from producing visual material of sexually explicit conduct, generating direct statements that the account holder should engage in sexually explicit conduct, or generate statements that sexually objectify the account holder, (iv) instituting reasonable measures to prevent the service from generating statements that would lead reasonable persons to believe they are interacting with a human, and (v) offering tools for managing privacy and account settings. - Expressly excludes software applications, web interfaces, or computer programs that are accessible only to individuals who have entered into a commercial agreement, enterprise contract, or similar business arrangement with the operator."
    enforcement: "- Subject to an injunction and liable for $1,000 per violation not to exceed $500,000 per operator or actual damages, whichever is greater."
