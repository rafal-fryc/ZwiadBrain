    requirements: "Requires a social media platform to: - Provide a reasonably accessible mechanism to California users to report to the social media platform any sexually explicit image or video of them posted on that platform that was created or altered through digitization without their consent (i.e., “sexually explicit digital identity theft”); - Temporarily block any covered material from being publicly viewable on the social media platform pending the social media platform’s determination on the report; and - Removing any covered material from being publicly viewable on the social media platform once the platform determines there is a reasonable basis to believe the reported material is sexually explicit digital identity theft."
    enforcement: "Not specified."
  - jurisdiction: "US-CA"
