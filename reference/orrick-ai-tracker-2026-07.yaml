    requirements: "Imposes several requirements on state agency use of AI and automated decision-making tools, including: - Requires state agencies to publish an online list of the automated decision-making tools they use. - Requires state agencies to conduct, submit and publish an impact assessment for the lawful application and use of automated decision-making tools. - Requires state agencies and any entity acting on their behalf to operationalize meaningful human review of automated decision-making tools that are used to (i) allocate public assistance benefits, or (ii) which may otherwise impact an individual's rights, safety, or welfare. Such tools must also be subject to an initial impact assessment to be repeated at least every two years. - Prohibits state agencies from using automated decision-making systems to make internal employment decisions if they may result in discharge, displacement, loss of position, or impairment of collective bargaining agreements."
