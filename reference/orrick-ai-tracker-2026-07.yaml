    effective_raw: null
    bill_key: null
    law_link: "https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB524"
    requirements: "- Requires law enforcement agencies to maintain a policy to require an official report prepared by the law enforcement agency (or one of its members) that is generated using AI either fully or partially to contain: - A disclosure on each page of the report (or within the body of the text) that the report was written either fully or in part using AI and the identity of every specific AI program used; and - The signature of the law enforcement officer or member who prepared the official report verifying that they reviewed the contents of the report and that the facts contained in the report are true and correct. - Requires law enforcement agencies who use AI to create an official report, whether fully or partially, to retain the first draft created and to maintain an audit trail for as long as the official report is retained. - Requires contracted vendors to not share, sell, or otherwise use information provided by a law enforcement agency to be processed by AI except for the contracted law enforcement agency's purposes or pursuant to a court order (with certain exceptions for accessing such data for troubleshooting, bias mitigation, accuracy improvement, or system refinement)."
    enforcement: "N/A"
  - jurisdiction: "US-CA"
