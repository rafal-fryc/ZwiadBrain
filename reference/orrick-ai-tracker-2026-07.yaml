    requirements: "- Requires operators of a \"companion chatbot\" to: - Clearly and conspicuously disclose to a user that he or she is interacting with an AI companion chatbot and not a person both at the beginning of each interaction / session and at least every 3 hours during continued interaction; - Implement, maintain and a protocol for detecting and addressing sever harm or related emotional crises. - Refrain from representing that the chatbot is licensed, certified or otherwise authorized to provide professional mental health, behavioral health, medical, or counseling services (unless lawfully authorized to do so). - Use a commercially reasonable age assurance method when generating synthetic content containing sexually explicit conduct . - Implement measures where the operator knows or should have known a user is a minor (under 18), including to disclose that the user is interacting with AI every 1 hour and to institute reasonable measures to prevent the bot from making statements that would lead a person to think they are interacting with a human, producing visual material of sexually explicit conduct, generating statements that sexually objectify the user or suggest the user engage in sexual conduct, simulating a romantic or sexual relationship with the user, role-playing adult-minor romantic relationships, encouraging the minor to keep secrets from trusted adults, encouraging social isolation or exclusive reliance on the chatbot for emotional support, simulating emotional distress, guilt, abandonment, or loneliness in certain circumstances, or generating statements encouraging self-harm."
    enforcement: "- Civil penalty up to $10,000 per violation."
