    law_link: "https://le.utah.gov/Session/2026/bills/enrolled/HB0276.pdf"
    requirements: "- Requires providers of certain covered generative AI systems to include a detectable, latent disclosure in AI-generated image, audio, and video content created or substantially modified by the provider’s AI system that the content was generated by the system. - Requires certain large online platforms to: - Detect whether any compliant system provenance data is embedded into or attached to content distributed on the platform; - Provide a user interface to disclose the availability of system provenance data; - Allow a user to inspect all available compliant system provenance data in an easily accessible manner; and - Refrain from stripping any system provenance data or digital signature from content uploaded or distributed on the large online platform. - Starting January 1, 2028, requires \"capture device manufacturers\" (e.g., camera and mobile phone manufacturers) to embed a latent disclosure in content captured by the device by default, but allows the manufacturer to provide an option for the user to disable such latent disclosure."
