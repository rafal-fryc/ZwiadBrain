    requirements: "- Requires insurers, nonprofit health service plans, health maintenance organizations, dental plan organizations, and any other persons that provide health benefit plans subject to regulation by MD to submit to the Commissioner on a quarterly basis certain information relating to claims, including the number of adverse decisions by the carrier and whether an artificial intelligence, algorithm, or other software tool was used in making the adverse decision. - Further requires such covered entities to ensure that: - AI systems base their determinations on relevant clinical information and not solely on a group dataset; - Any criteria or guidelines for using an AI system complies with these requirements; - An AI system does not replace the role of a health care provider in the determination process under § 15-10B-07 (setting forth adverse decision procedures); - Use of AI does not result in unfair discrimination, and is otherwise fairly and equitably applied; - AI systems are open to inspection for audit or compliance reviews by the Commissioner; - Written policies and procedures are included in the utilization plan, including how an AI system will be used and what oversight will be provided; - The performance, use and outcomes of AI are reviewed and revised, if necessary and at least on a quarterly basis, to maximize accuracy and reliability; - Patient data is not used beyond its intended and state purpose, consistent with HIPAA; and - An AI system does not directly or indirectly cause harm to an enrollee, nor deny, delay or modify health care services."
    enforcement: "Existing enforcement mechanism by the Maryland Insurance Commissioner apply."
