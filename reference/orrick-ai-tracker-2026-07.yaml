    law_link: "https://cppa.ca.gov/regulations/pdf/ccpa_updates_cyber_risk_admt_appr_text.pdf"
    requirements: "Addresses the use of automated decision-making technology (\"ADMT\") when used to make significant decisions regarding consumers (those relating to financial or lending services, housing, education, employment, and healthcare): - Businesses must conduct a risk assessment when using ADMT to make significant decisions, or when using personal information to train ADMT. - Businesses that make ADMT (trained on personal information) available to another business to make a significant decision must provide to the recipient-business all facts available to the business that are necessary for the recipient-business to conduct its own risk assessment. - Businesses must provide pre-use notices to inform consumers about the use of ADMT, details about the ADMT, and the right to opt-out and access further information. - Businesses must allow consumers to opt out and provide consumers with access to information about the ADMT's use and logic. Other obligations and restrictions may apply depending on the type of data processed."
    enforcement: "Up to $7,500 per violation."
