# ZwiadBrain relevance taxonomy (decision 17).
#
# Single source for two stages of the relevance pipeline:
#   - RECALL  — `reference/loader.py` flattens every topic's `seeds` into the
#               keyword pre-filter that narrows the candidate universe.
#   - PRECISION — the `classifier` subagent reads THIS FILE directly and applies
#               `positive_criteria` + `disqualify` as its rubric, returning
#               {in_scope, topics[], confidence, rationale, criterion}.
#
# Keep the two stages here so they cannot drift. `topics[]` values written to a
# bill page must be one of the topic keys below (ai | privacy | cyber).

topics:
  ai:
    label: "Artificial Intelligence"
    seeds:
      - "artificial intelligence"
      - "automated decision"
      - "automated employment"
      - "algorithmic"
      - "facial recognition"
      - "biometric"
      - "deepfake"
      - "synthetic media"
      - "generative ai"
      - "machine learning"
      - "frontier model"
      - "chatbot"

  privacy:
    label: "Consumer Privacy & Data Protection"
    seeds:
      - "personal data"
      - "personal information"
      - "consumer privacy"
      - "data privacy"
      - "data protection"
      - "data broker"
      - "data breach"
      - "breach notification"
      - "children's privacy"
      - "biometric privacy"
      - "geolocation"

  cyber:
    label: "Cybersecurity"
    seeds:
      - "cybersecurity"
      - "cyber security"
      - "ransomware"
      - "critical infrastructure"
      - "incident reporting"
      - "data security"
      - "encryption"
      - "CISA"

# A bill is IN SCOPE when it satisfies at least one of these (the classifier must
# name which one it satisfied).
positive_criteria:
  - "Creates, amends, or repeals obligations governing AI or automated decision-making systems (development, deployment, transparency, impact assessment, or prohibited uses)."
  - "Regulates the collection, processing, sale, sharing, or retention of personal data, or grants/limits consumer privacy rights."
  - "Establishes cybersecurity requirements, breach-notification duties, incident reporting, or critical-infrastructure protection."
  - "Authorizes or constrains government use of AI, biometric, surveillance, or data-broker capabilities."
  - "Creates or funds an enforcement, oversight, or standards body specifically for AI, privacy, or cybersecurity."

# A bill is OUT OF SCOPE if it matches a disqualifier despite containing a seed
# term. For borderline items the classifier must name which disqualifier it
# survived. (decision 17 — precision with stated negative criteria.)
disqualify:
  - "Appropriations or budget bill that merely funds an agency, with no AI/privacy/cyber operative text of its own."
  - "Ceremonial, commemorative, or congratulatory resolution (e.g. naming a day, honoring a person or organization)."
  - "A seed term appears only in findings, recitals, 'whereas' clauses, or a bill's title — not in any operative/enacting provision."
  - "Tax, trade, or general-commerce bill that references 'data' or 'information' only incidentally (e.g. recordkeeping, reporting of unrelated metrics)."
  - "Health, education, or financial bill where any data/technology mention is incidental to a non-AI/privacy/cyber purpose."
  - "Bill solely about physical telecommunications/broadband infrastructure with no data-protection or cybersecurity provisions."

# Stage-2 recall: Congress.gov controlled `policyArea` buckets worth probing when a
# bill's TITLE carries no seed term. Deliberately broad (favors recall); the Claude
# classifier applies precision afterward. (PHASE-03.1)
policy_areas:
  - "Science, Technology, Communications"          # AI, internet, telecom, tech
  - "Crime and Law Enforcement"                    # cyber, surveillance
  - "Commerce"                                     # consumer privacy, data brokers, FTC
  - "Civil Rights and Liberties, Minority Issues"  # privacy, biometric, surveillance
  - "Armed Forces and National Security"           # cyber, critical infrastructure
  - "Finance and Financial Sector"                 # financial-data privacy (decision 32)
