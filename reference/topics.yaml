# ZwiadBrain relevance taxonomy (decision 17).
#
# Single source for two stages of the relevance pipeline:
#   - RECALL  — `reference/loader.py` flattens every topic's `seeds` into the
#               keyword pre-filter that narrows the candidate universe.
#   - PRECISION — the `classifier` subagent reads THIS FILE directly and applies
#               `positive_criteria` + `disqualify` as its rubric, returning
#               {in_scope, topics[], confidence, rationale, criterion}.
#
# Keep the two stages here so they cannot drift. `topics[]` values written to a
# bill page must be one of the topic keys below (ai | privacy | cyber).

topics:
  ai:
    label: "Artificial Intelligence"
    seeds:
      - "artificial intelligence"
      - "automated decision"
      - "automated employment"
      - "algorithmic"
      - "facial recognition"
      - "biometric"
      - "deepfake"
      - "synthetic media"
      - "generative ai"
      - "machine learning"
      - "frontier model"
      - "chatbot"
      - "digital replica"
      - "AI transparency"

  privacy:
    label: "Consumer Privacy & Data Protection"
    seeds:
      - "personal data"
      - "personal information"
      - "consumer privacy"
      - "data privacy"
      - "data protection"
      - "data broker"
      - "data breach"
      - "breach notification"
      - "children's privacy"
      - "biometric privacy"
      - "biometric information"
      - "geolocation"
      - "security breach"
      - "breach of security"
      - "health data"
      - "biological data"
      - "addictive feed"

  cyber:
    label: "Cybersecurity"
    seeds:
      - "cybersecurity"
      - "cyber security"
      - "ransomware"
      - "critical infrastructure"
      - "incident reporting"
      - "data security"
      - "encryption"
      - "CISA"

# Scope-rule vintage (D96). Bump to the newest DECISIONS entry whenever a change
# below alters what is in/out of scope. `record-rejects` stamps this version onto
# every new reject-ledger entry; `stale-rejects` compares stamped versions against
# this value to surface rejects recorded under superseded rules.
scope_version: "D95"

# SCOPE (D86): ZwiadBrain tracks only laws that impose effects/obligations on
# PRIVATE-SECTOR COMPANIES — the regulated-industry compliance landscape. Laws
# governing the GOVERNMENT's own use/operations (its surveillance/intelligence
# authorities, internal IT/security, federal hiring, procurement, or inter-agency
# data-sharing) are OUT, even when they mention AI/biometric/surveillance/data.
#
# A bill is IN SCOPE when it satisfies at least one of these (the classifier must
# name which one it satisfied).
positive_criteria:
  - "Creates, amends, or repeals obligations governing AI or automated decision-making systems (development, deployment, transparency, impact assessment, or prohibited uses)."
  - "Regulates the collection, processing, sale, sharing, or retention of personal data, or grants/limits consumer privacy rights."
  - "Establishes cybersecurity requirements, breach-notification duties, incident reporting, or critical-infrastructure protection — including cybersecurity/security mandates on PRIVATE critical-infrastructure operators (energy, water, telecom, aviation, pipelines, hazardous storage). A bill securing only the GOVERNMENT's own systems/infrastructure stays OUT (D86/D95)."
  - "Regulates a company's use, sale, or deployment of biometric, facial-recognition, surveillance, or data-broker capabilities (obligations on private-sector actors — NOT the government's own operations; see SCOPE above)."
  - "Creates or funds an enforcement, oversight, or standards body specifically for AI, privacy, or cybersecurity."

# A bill is OUT OF SCOPE if it matches a disqualifier despite containing a seed
# term. For borderline items the classifier must name which disqualifier it
# survived. (decision 17 — precision with stated negative criteria.)
disqualify:
  - "Appropriations, budget, or omnibus authorization vehicle that merely funds/authorizes agencies, with no AI/privacy/cyber operative text of its own — BUT a discrete operative provision imposing an AI/privacy/cyber obligation on companies that rides in such a vehicle (e.g. a data-broker restriction in an omnibus, as in PL 118-50) IS in scope for that provision."
  - "Ceremonial, commemorative, or congratulatory resolution (e.g. naming a day, honoring a person or organization)."
  - "A seed term appears only in findings, recitals, 'whereas' clauses, or a bill's title — not in any operative/enacting provision."
  - "Tax, trade, or general-commerce bill that references 'data' or 'information' only incidentally (e.g. recordkeeping, reporting of unrelated metrics)."
  - "Health, education, or financial bill where any data/technology mention is incidental to a non-AI/privacy/cyber purpose."
  - "Bill solely about physical telecommunications/broadband infrastructure with no data-protection or cybersecurity provisions."
  - "Governs the GOVERNMENT's own use or operations — its surveillance/intelligence authorities (e.g. FISA Section 702), internal IT/cybersecurity, federal hiring, procurement, or inter-agency data-sharing — without imposing AI/privacy/cyber obligations on private-sector companies (D86)."

# Enforcement-action relevance (D55). Reuses the shared topic keys (ai|privacy|cyber)
# above; the classifier subagent applies these enforcement-specific criteria, NOT the
# bill criteria, when judging an FTC/AG action.
positive_criteria_enforcement:
  - "An FTC or state-AG action (complaint, consent order, settlement, civil penalty, assurance of discontinuance, warning letter, or enforcement-commencement notice) whose charges or compliance demands concern AI or automated-decision systems."
  - "An action charging unlawful collection/processing/sale/sharing of personal data, data-broker conduct, children's-privacy (COPPA), biometric data, or a data breach."
  - "An action charging a data-security or cybersecurity failure (inadequate safeguards, breach response, unauthorized access)."
  - "An action concerning government or commercial biometric, surveillance, or facial-recognition use."

disqualify_enforcement:
  - "Antitrust, merger, or competition action with no AI/privacy/cyber/data nexus."
  - "Deceptive-advertising or consumer-protection action about a non-data product (e.g. weight-loss, earnings claims) where no data/AI/security duty is charged — but this does NOT apply when the misrepresentation itself concerns an AI, data-collection, privacy, or security capability (e.g. false claims about an AI service or about consumer consent to data collection are IN scope)."
  - "Pure payment-fraud, do-not-call/TSR, or financial-disclosure action with no data-protection or data-security dimension."
  - "AI/privacy/cyber is mentioned only incidentally and is not a basis of the charges."

# Stage-2 recall: Congress.gov controlled `policyArea` buckets worth probing when a
# bill's TITLE carries no seed term. Deliberately broad (favors recall); the Claude
# classifier applies precision afterward. (PHASE-03.1)
policy_areas:
  - "Science, Technology, Communications"          # AI, internet, telecom, tech
  - "Crime and Law Enforcement"                    # cyber, surveillance
  - "Commerce"                                     # consumer privacy, data brokers, FTC
  - "Civil Rights and Liberties, Minority Issues"  # privacy, biometric, surveillance
  - "Armed Forces and National Security"           # cyber, critical infrastructure
  - "Finance and Financial Sector"                 # financial-data privacy (decision 32)
