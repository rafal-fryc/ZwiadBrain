# Hand-verified corrections applied to the external-tracker snapshot before the
# coverage cross-check (`zwiadbrain tracker-gap`). PHASE-29.
#
# Two kinds, both keyed by (state, the tracker's VERBATIM bill_number):
#   correct_number — the tracker recorded the bill number wrong (Orrick's "Law Link"
#                    anchor text occasionally loses the chamber prefix, or names the
#                    wrong chamber entirely).
#   correct_state  — the tracker filed the law under the wrong jurisdiction.
#   year           — pins the session year when the tracker's own link to the law is
#                    an opaque document id, so the number matcher can pick between
#                    sessions that reuse it. The year is verified against the state's
#                    LegiScan session spans; each pin lands inside exactly one.
#
# A correction that matches no tracker row is a hard error, so a stale entry surfaces
# the moment the snapshot is refreshed instead of quietly doing nothing.

corrections:
  # --- tracker-side number errors ---
  - state: va
    bill_number: "B 2678"
    correct_number: "HB 2678"
    year: 2019
    why: >-
      Orrick's Law Link anchor text lost the chamber prefix. The link resolves to
      "191+ful+CHAP0490" — Chapter 490 of the 2019 Virginia session, i.e. HB 2678.

  - state: ks
    bill_number: "SB 2313"
    correct_number: "HB 2313"
    year: 2025
    why: >-
      Kansas Senate bills never reach 2313 (House bills are the 2xxx series). Orrick's
      own link is "hb2313_enrolled.pdf" in the 2025-26 biennium.

  - state: tx
    bill_number: "SB 837"
    correct_state: tn
    year: 2025
    why: >-
      Orrick files "Law Relating to Personhood" under Texas, but Texas SB 837 (89R) is
      "Relating to a family preservation services program" and Texas held no 2026
      session. The law is TENNESSEE SB 837 (companion HB 849) — defines "human being",
      "life" and "natural person" for statutory construction and excludes AI; passed
      the Senate 26-6 on 2026-04-06 and the House 93-2 on 2026-04-08. Tennessee's
      113th/114th General Assemblies are two-year sessions, so the 2025 pin covers it.

  - state: me
    bill_number: "HP 1397"
    correct_number: "LD 2082"
    year: 2025
    why: >-
      Maine bills carry both a paper number (HP/SP) and an LD number; LegiScan indexes
      the LD. HP 1397 is LD 2082, "An Act to Regulate the Use of Artificial Intelligence
      in Providing Certain Mental Health Services" — already tracked as me-2025-ld-2082.

  - state: ny
    bill_number: "A 9449"
    correct_number: "S 8828"
    year: 2025
    why: >-
      A 9449 (AI developer transparency; Chapter 96, signed 2026-03-27) is the Assembly
      companion of S 8828, its own "same as". Deduped to the Senate version per the
      PHASE-27 companion rule.

  - state: ny
    bill_number: "A 9487"
    correct_number: "S 8831"
    year: 2025
    why: >-
      A 9487 (public-entity AEDT use; Chapter 86, signed 2026-02-13) is the Assembly
      companion of S 8831, its own "same as". S 8831 is already in the reject ledger —
      text-grounding showed it binds counties/cities/school districts, not commercial
      employers (D86).

  # --- session-year pins (opaque or biennium-only tracker links) ---
  # Every gap row without a link-derived year is pinned here. Without a pin, a bill
  # number that matches in exactly ONE scanned session resolves to it — and a state
  # renumbers bills every session, so the sole match can be an unrelated old law.
  # (NY A 433 resolved to a 2019 "key persons" bill before these pins existed.)
  - state: az
    bill_number: "HB 2394"
    year: 2024
    why: "Link path '/legtext/56leg/2R/' is the 56th Legislature 2nd Regular Session = 2024."

  - state: az
