# Tracker rows deliberately dropped from the cross-check. Recorded here rather than
# left as a recurring "not-found" so the gap actually closes, with the reason on the
# record. A stale exclusion is a hard error, same as a stale correction.
exclusions:
  - state: ny
    bill_number: "A 10005"
    why: >-
      New York budget Article VII bill ("Enacts into law major components of legislation
      necessary to implement the state fiscal plan"). MultiState marks it enacted;
      LegiScan carries it at status 1 (Introduced), so it never enters the enacted-only
      pipeline. Out of scope regardless under the standing budget-omnibus exclusion
      applied to ny a-8805/a-8808 and a-3005/s-3008.

  - state: ny
    bill_number: "S 9000"
    why: >-
      New York State Operations Budget (Chapter 50, signed 2026-06-09; same-as A 10000-D).
      Absent from LegiScan's NY masterlist entirely. A pure appropriations vehicle — the
      first taxonomy disqualifier — so no classifier pass is warranted.
