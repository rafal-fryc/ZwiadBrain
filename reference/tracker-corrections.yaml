# Tracker rows deliberately dropped from the cross-check. Recorded here rather than
# left as a recurring "not-found" so the gap actually closes, with the reason on the
# record. A stale exclusion is a hard error, same as a stale correction.
exclusions:
  - state: ny
    bill_number: "A 10005"
    why: >-
      New York budget Article VII bill ("Enacts into law major components of legislation
      necessary to implement the state fiscal plan"). MultiState marks it enacted;
      LegiScan carries it at status 1 (Introduced), so it never enters the enacted-only
      pipeline. Out of scope regardless under the standing budget-omnibus exclusion
      applied to ny a-8805/a-8808 and a-3005/s-3008.

  - state: ny
    bill_number: "S 9000"
    why: >-
      New York State Operations Budget (Chapter 50, signed 2026-06-09; same-as A 10000-D).
      Absent from LegiScan's NY masterlist entirely. A pure appropriations vehicle — the
      first taxonomy disqualifier — so no classifier pass is warranted.

  - state: ny
    bill_number: "S 9006"
    why: >-
      Another New York budget Article VII vehicle ("Enacts into law major components of
      legislation necessary to implement the state fiscal plan"), same class as A 10005
      and S 9000. LegiScan has no 2025-2026 S 9006; the number resolves only to an
      unrelated 2017-2018 bill on the town of Camillus.

  - state: ny
    bill_number: "S 8793"
    why: >-
      Chapter 19 of 2026 (signed 2026-02-13; same-as A 9456) — aligns STATE and municipal
      procurement rules with the federal ban on buying security-risk technology. A
      government-procurement law with no private-sector obligation, so out under D86
      regardless; and LegiScan carries no 2025-2026 S 8793, resolving the number only to
      an unrelated 2019-2020 bill about the Village of Patchogue.

  - state: ny
    bill_number: "A 433"
    why: >-
      Orrick links the codified statute (STT ch. 57-A), not a bill, and its "A 433" does
      not identify one: New York A 433 of 2023-2024 is a Buster's Law animal-welfare bill
      and A 433 of 2019-2020 regulates "key persons". The government-AEDT subject matter
      it describes is already covered by tracked/rejected items — S 7543B (LOADinG Act)
      and S 8831 — both out under D86 as government own-use.

  - state: ga
    bill_number: "SB 466"
    why: >-
      Orrick lists this as an enacted Georgia CSAM amendment effective 2024-07-01, but
      LegiScan's record for SB 466 of the 2023-2024 session (bill_id 1840506, "Obscenity
      and Related Offenses") ends at "Senate Read Second Time" — read, referred,
      favorably reported, never passed. Same class as the Oregon SB 1546 finding: a
      tracker listing a bill that died. Enacted-only discovery correctly excludes it.
