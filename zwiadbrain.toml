[[enforcement.state_ag]]
name = "Texas OAG"
agency_slug = "tx-oag"
jurisdiction = "US-TX"
url = "https://www.texasattorneygeneral.gov/news/releases"
kind = "html"
item_selector = ""
enabled = false

[[enforcement.state_ag]]
name = "Colorado OAG"
agency_slug = "co-oag"
jurisdiction = "US-CO"
url = "https://coag.gov/press-releases/"
kind = "html"
item_selector = ""
enabled = false

[[enforcement.state_ag]]
name = "Virginia OAG"
agency_slug = "va-oag"
