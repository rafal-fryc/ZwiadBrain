# ZwiadBrain configuration. Secrets live in .env (gitignored), never here.
# The config loader (config.py) is added in a later phase; this file is the
# committed source of operational settings.

[llm]
# Default to the latest, most capable Claude models.
model = "claude-opus-4-7"
classifier_model = "claude-haiku-4-5-20251001"
# Prompt caching is applied to the reference/taxonomy prefix in llm/client.py.

[sources]
enabled = ["congress", "govinfo", "legiscan", "ftc", "state_ag"]

[states]
# Target coverage is all 50 states via LegiScan (D49); rollout is phased — expand
# by adding state codes to `enabled`. The code is state-count-agnostic; the binding
# constraint at scale is classifier/summarizer plan usage (D26), not LegiScan quota.
# `enabled` is the active set; start with the 7 priority states.
enabled = ["ca", "ny", "tx", "co", "va", "wa", "il"]

[lawbrain]
enabled = true
# Set the law-brain location via LAW_BRAIN_PATH in .env (gitignored; read-only — ZwiadBrain
# never edits the law brain). Optionally hardcode a machine-local fallback here, e.g.:
# path = "/path/to/Brains/law"
min_confidence = 0.75
require_shared_key = true        # decision 16: deterministic shared-key confirm gates auto-apply
demote_headings = true           # decision 6: copied ## headings demoted to ###
commentary = true
discover = false                 # decision 14 / PHASE-11 gate — do NOT enable until approved
commentary_only_types = ["concept", "framework", "vendor", "person", "matter"]
commentary_only_slug_markers = ["tracker", "landscape", "map", "scholarship"]
further_reading = true            # decision 62: harvest a "Further Reading (via law brain)" link list
# decision 62: drop harvested links whose host ends with any of these suffixes (primary sources, not commentary).
primary_source_domains = [".gov", "legiscan.com", "courtlistener.com", "wikipedia.org", "europa.eu", "legislation.gov.uk"]

[lawbrain.type_map]
# decision 8: which law-brain page types map to which ZwiadBrain page kind.
regulation = "bill"
statute = "bill"
case = "enforcement"
guidance = "enforcement"
incident = "enforcement"
enforcement = "enforcement"

[enforcement]
enabled = true
lookback_days = 30
min_confidence = 0.75
match_window_days = 120

[enforcement.ftc]
enabled = true
rss_url = "https://www.ftc.gov/feeds/press-release.xml"   # validated in UAT (T15)

[[enforcement.state_ag]]
name = "California OAG"
agency_slug = "ca-oag"
jurisdiction = "US-CA"
# UAT (2026-05-31, B2): the old /news/press-releases listing now 404s; the working
# listing is /media/news, which links to individual /news/press-releases/<slug> articles.
url = "https://oag.ca.gov/media/news"
kind = "html"
item_selector = 'a[href*="/news/press-releases/"]'
enabled = true

[[enforcement.state_ag]]
name = "New York OAG"
agency_slug = "ny-oag"
jurisdiction = "US-NY"
url = "https://ag.ny.gov/press-releases"
kind = "html"
item_selector = ".field-content a[href]"   # B2 (2026-05-31): Drupal press-release list anchors
enabled = true

[[enforcement.state_ag]]
name = "Texas OAG"
agency_slug = "tx-oag"
jurisdiction = "US-TX"
url = "https://www.texasattorneygeneral.gov/news/releases"
kind = "html"
item_selector = ".m-b-1.h4-sans a[href]"   # B2 (2026-05-31): release-title anchors
enabled = true

[[enforcement.state_ag]]
name = "Colorado OAG"
agency_slug = "co-oag"
jurisdiction = "US-CO"
# B2 (2026-05-31): the press-release list at coag.gov is rendered client-side (JS) — the
# static HTML carries only nav links, so the httpx+bs4 adapter can't see the releases.
# Left disabled until a JS-capable fetch or a JSON/RSS endpoint is found (D54).
url = "https://coag.gov/press-releases/"
kind = "html"
item_selector = ""
enabled = false

[[enforcement.state_ag]]
name = "Virginia OAG"
agency_slug = "va-oag"
jurisdiction = "US-VA"
url = "https://www.oag.state.va.us/media-center/news-releases"
kind = "html"
item_selector = ".list-title a[href]"   # B2 (2026-05-31): news-release list-title anchors
enabled = true

[[enforcement.state_ag]]
name = "Washington OAG"
agency_slug = "wa-oag"
jurisdiction = "US-WA"
url = "https://www.atg.wa.gov/news/news-releases"
kind = "html"
# B2 (2026-05-31): title-only anchors; .field-content also matches the duplicate
# "Click here to read..." links, so target the views title field instead.
item_selector = ".views-field-title a[href]"
enabled = true

[[enforcement.state_ag]]
name = "Illinois OAG"
agency_slug = "il-oag"
jurisdiction = "US-IL"
# B2 (2026-05-31): the old /news/ path 404s; the newsroom is /News-Room/, whose entries
# link to individual /news/story/<slug> articles (date-ordered, newest first).
url = "https://illinoisattorneygeneral.gov/News-Room/"
kind = "html"
item_selector = 'a[href*="/news/story/"]'
enabled = true

# Topic taxonomy, keyword seed lexicon, and the DISQUALIFY lexicon (decision 17)
# live in reference/topics.yaml (added in PHASE-04).
